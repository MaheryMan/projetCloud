<!DOCTYPE html>
<html>
<head>
    <title>Test Upload Photos</title>
</head>
<body>
    <h1>Test Upload Photos</h1>
    <input type="file" id="fileInput" multiple accept="image/*">
    <button onclick="uploadFiles()">Upload</button>
    <div id="result"></div>

    <script>
        async function uploadFiles() {
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) {
                alert('Sélectionnez des fichiers');
                return;
            }

            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            try {
                const response = await fetch('http://localhost:8080/api/photos/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${error}`);
                }

                const urls = await response.json();
                document.getElementById('result').innerHTML = 
                    '<h3>Upload réussi!</h3>' +
                    '<ul>' +
                    urls.map(url => `<li><img src="${url}" width="100"><br>${url}</li>`).join('') +
                    '</ul>';
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<h3 style="color:red">Erreur: ${error.message}</h3>`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
