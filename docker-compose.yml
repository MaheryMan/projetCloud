services:

  postgres:
    image: postgres:latest
    container_name: pg-auth
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-network
    restart: unless-stopped

  api:
    build:
      context: ./app
    container_name: cloud-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloud
      SPRING_DATASOURCE_USERNAME: cloud
      SPRING_DATASOURCE_PASSWORD: cloud
    networks:
      - app-network
    restart: unless-stopped

  map:
    image: maptiler/tileserver-gl:latest
    container_name: osm-map
    ports:
      - "8081:8080"
    volumes:
      - ./map:/data
    # On remplace la variable d'env MBTILES_FILE par la commande config
    command: -c /data/config.json
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
